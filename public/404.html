<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>重定向中...</title>
    <script>
      // 单页应用路由重定向
      // GitHub Pages 会在找不到页面时显示这个 404.html
      // 我们将路径保存到 sessionStorage 并重定向到首页
      sessionStorage.setItem('redirect', location.pathname.slice(0, -1) + location.search + location.hash);
      location.replace('/');
    </script>
  </head>
  <body>
    重定向中...
  </body>
</html>
